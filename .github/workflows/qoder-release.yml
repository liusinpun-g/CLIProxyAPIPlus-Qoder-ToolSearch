name: Qoder tool-search prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; a missing tag is created at the selected workflow commit
        required: true
        type: string
      publish:
        description: Publish the prerelease after validation (otherwise keep a draft)
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: qoder-prerelease-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Validate tag name
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-qoder-tools\.[1-9][0-9]*$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve reviewed release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "$RELEASE_TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Experimental Qoder tool-search prerelease"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Test affected packages
        run: go test ./internal/responsestools ./internal/runtime/executor/helps ./internal/runtime/executor ./internal/client/codex/models ./sdk/api/handlers/openai
      - name: Package reviewed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/package-qoder-release.sh "$RELEASE_TAG"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          release_args=(--prerelease --latest=false)
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            release_args+=(--draft)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${release_args[@]}" --title "Qoder Tool Search $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md dist/*.tar.gz dist/checksums.txt
